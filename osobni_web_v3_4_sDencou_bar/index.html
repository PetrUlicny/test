<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:image" content="https://test.ulicnybusiness.workers.dev/img/ja_logo.png">
    <title>Petr Uličný | Doučování a Tvorba webů</title>
    <link rel="icon" type="image/x-icon" href="/img/ja_logo_3.png">
    <link rel="stylesheet" href="/static/variable.css">
    <link rel="stylesheet" href="/static/style_index.css">
    <script src="/static/script.js"></script>
</head>
<body class="home-page">

<header class="split-layout">
    
    <div class="mobile-toggle" id="mobile-toggle-container">
        <div class="toggle-slider"></div>

        <button class="toggle-btn active" id="btn-tutoring" onclick="switchTab('tutoring')">Doučování</button>
        <button class="toggle-btn" id="btn-web" onclick="switchTab('web')">Weby</button>
    </div>

    <!-- Levá polovina - Doučování (Na mobilu aktivní jako první) -->
    <section id="tutoring-section" class="split-side tutoring-side active-tab">
        <div class="split-content">
            <h1>Potřebuji<br><span class="highlight-doucovani-color">doučování</span></h1>
            <p>Individuální přístup, trpělivost a jasné vysvětlení látky. Zlepšete své výsledky bez stresu.</p>
            <a href="/templates/doucovani.html" class="btn btn-doucovani-color">Zjistit více o doučování</a>
        </div>
    </section>

    <!-- Pravá polovina - Weby (Na mobilu skryto, dokud se nepřepne) -->
    <section id="web-section" class="split-side web-side">
        <div class="split-content">
            <h1>Chci vytvořit<br><span class="highlight-weby-color">web</span></h1>
            <p>Moderní, rychlé a responzivní weby na míru. Od návrhu až po spuštění a následnou správu.</p>
            <a href="/templates/weby.html" class="btn btn-weby-color">Zjistit více o webech</a>
        </div>
    </section>

    <section class="name">
        <p>PETR ULIČNÝ</p>
    </section>  
</header>

</body>
</html>
